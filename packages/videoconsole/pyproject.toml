[project]
name = "videoconsole"
version = "0.1.0"
description = "Console output shared by the video-tools command lines: live progress and run reports."
readme = "README.md"
license = "MIT"
authors = [
    { name = "dbarretol", email = "57958754+dbarretol@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "videocore",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
videocore = { workspace = true }
