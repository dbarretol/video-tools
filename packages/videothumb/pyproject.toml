[project]
name = "videothumb"
version = "0.1.0"
description = "Generate contact sheets and individual snapshots from videos (GUI and CLI)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "dbarretol", email = "57958754+dbarretol@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "videocore",
]

[project.scripts]
videothumb = "videothumb.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
videocore = { workspace = true }
