[project]
name = "videocore"
version = "0.1.0"
description = "Shared video primitives for video-tools: probing, frame sampling, grids and batch processing."
readme = "README.md"
license = "MIT"
authors = [
    { name = "dbarretol", email = "57958754+dbarretol@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "pillow>=13.0.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
