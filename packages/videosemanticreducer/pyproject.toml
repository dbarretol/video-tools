[project]
name = "videosemanticreducer"
version = "0.2.0"
description = "Archive videos before deleting them: summary video, contact sheet, metadata report and perceptual fingerprint."
readme = "README.md"
license = "MIT"
authors = [
    { name = "dbarretol", email = "57958754+dbarretol@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imagehash>=4.3.2",
    "pyyaml>=6.0.3",
    "videoconsole[notify]",
    "videocore",
]

[project.scripts]
videosemanticreducer = "videosemanticreducer.cli:main"
vsr = "videosemanticreducer.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
videocore = { workspace = true }
videoconsole = { workspace = true }
