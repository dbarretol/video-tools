[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["videocore", "videothumb", "videosemanticreducer"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
